global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3000']
  
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:3001']

  - job_name: 'reliability-console'
    static_configs:
      - targets: ['reliability-console:3000']
